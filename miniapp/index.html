<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h1>📚 Digital Library</h1>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="စာအုပ်ရှာရန်...">
        </div>
        
        <div class="categories">
            <button class="category-btn active" data-category="all">အားလုံး</button>
            <button class="category-btn" data-category="fiction">ဝတ္ထု</button>
            <button class="category-btn" data-category="education">ပညာရေး</button>
            <button class="category-btn" data-category="technology">နည်းပညာ</button>
        </div>
        
        <div id="bookGrid" class="book-grid"></div>
    </div>
    
    <div id="bookModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle"></h2>
            <img id="modalCover" src="" alt="Cover">
            <p id="modalAuthor"></p>
            <p id="modalDesc"></p>
            <button id="openInBot" class="btn-primary">Bot တွင်ဖွင့်ရန်</button>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
