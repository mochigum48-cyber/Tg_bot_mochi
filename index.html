<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0A0C1F">

  <title>Reader's Odyssey</title>

  <link rel="stylesheet" href="css/home.css">
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body>
  <!-- Decorative background -->
  <div class="bg-mist bg-mist-1"></div>
  <div class="bg-mist bg-mist-2"></div>

  <div class="floating-decor decor-butterfly decor-butterfly-1" aria-hidden="true">
    <svg viewBox="0 0 120 90" class="butterfly-svg" xmlns="http://www.w3.org/2000/svg">
      <g class="wing left-wing">
        <path d="M58 45C41 18 15 10 8 27c-8 19 8 38 31 40 11 1 16-8 19-22Z" fill="#F7D982"/>
        <path d="M58 45C38 32 20 34 15 47c-5 13 7 22 22 19 11-2 17-10 21-21Z" fill="#60A4D9" fill-opacity=".35"/>
      </g>
      <g class="wing right-wing">
        <path d="M62 45C79 18 105 10 112 27c8 19-8 38-31 40-11 1-16-8-19-22Z" fill="#F7D982"/>
        <path d="M62 45C82 32 100 34 105 47c5 13-7 22-22 19-11-2-17-10-21-21Z" fill="#60A4D9" fill-opacity=".35"/>
      </g>
      <path d="M60 42v32" stroke="#F0C057" stroke-width="3" stroke-linecap="round"/>
      <path d="M60 42c-5-6-9-10-13-13" stroke="#F0C057" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M60 42c5-6 9-10 13-13" stroke="#F0C057" stroke-width="2" stroke-linecap="round" fill="none"/>
      <circle cx="60" cy="40" r="4" fill="#F0C057"/>
    </svg>
  </div>

  <div class="floating-decor decor-butterfly decor-butterfly-2" aria-hidden="true">
    <svg viewBox="0 0 120 90" class="butterfly-svg" xmlns="http://www.w3.org/2000/svg">
      <g class="wing left-wing">
        <path d="M58 45C41 18 15 10 8 27c-8 19 8 38 31 40 11 1 16-8 19-22Z" fill="#EFD7FF"/>
        <path d="M58 45C38 32 20 34 15 47c-5 13 7 22 22 19 11-2 17-10 21-21Z" fill="#A8D8FF" fill-opacity=".28"/>
      </g>
      <g class="wing right-wing">
        <path d="M62 45C79 18 105 10 112 27c8 19-8 38-31 40-11 1-16-8-19-22Z" fill="#EFD7FF"/>
        <path d="M62 45C82 32 100 34 105 47c5 13-7 22-22 19-11-2-17-10-21-21Z" fill="#A8D8FF" fill-opacity=".28"/>
      </g>
      <path d="M60 42v32" stroke="#F0C057" stroke-width="3" stroke-linecap="round"/>
      <path d="M60 42c-5-6-9-10-13-13" stroke="#F0C057" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M60 42c5-6 9-10 13-13" stroke="#F0C057" stroke-width="2" stroke-linecap="round" fill="none"/>
      <circle cx="60" cy="40" r="4" fill="#F0C057"/>
    </svg>
  </div>

  <div class="floating-decor decor-flower decor-flower-1" aria-hidden="true">
    <svg viewBox="0 0 120 120" class="flower-svg" xmlns="http://www.w3.org/2000/svg">
      <g>
        <ellipse cx="60" cy="25" rx="14" ry="24" fill="#F7D982"/>
        <ellipse cx="60" cy="25" rx="14" ry="24" fill="#F0C057" fill-opacity=".42" transform="rotate(45 60 60)"/>
        <ellipse cx="60" cy="25" rx="14" ry="24" fill="#F0C057" fill-opacity=".42" transform="rotate(90 60 60)"/>
        <ellipse cx="60" cy="25" rx="14" ry="24" fill="#F7D982" fill-opacity=".8" transform="rotate(135 60 60)"/>
        <circle cx="60" cy="60" r="16" fill="#FFEEB8"/>
        <circle cx="60" cy="60" r="8" fill="#F0C057"/>
      </g>
    </svg>
  </div>

  <div class="floating-decor decor-flower decor-flower-2" aria-hidden="true">
    <svg viewBox="0 0 120 120" class="flower-svg" xmlns="http://www.w3.org/2000/svg">
      <g>
        <ellipse cx="60" cy="25" rx="14" ry="24" fill="#DFF5E1"/>
        <ellipse cx="60" cy="25" rx="14" ry="24" fill="#6B9080" fill-opacity=".38" transform="rotate(45 60 60)"/>
        <ellipse cx="60" cy="25" rx="14" ry="24" fill="#91C7E8" fill-opacity=".28" transform="rotate(90 60 60)"/>
        <ellipse cx="60" cy="25" rx="14" ry="24" fill="#DFF5E1" fill-opacity=".78" transform="rotate(135 60 60)"/>
        <circle cx="60" cy="60" r="16" fill="#FFF6D8"/>
        <circle cx="60" cy="60" r="8" fill="#F0C057"/>
      </g>
    </svg>
  </div>

  <div class="petal petal-1" aria-hidden="true">❀</div>
  <div class="petal petal-2" aria-hidden="true">✿</div>
  <div class="petal petal-3" aria-hidden="true">❀</div>

  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark float-slow">
          <span>✦</span>
        </div>

        <div class="brand-text">
          <h1>Reader's Odyssey</h1>
          <p>Your reading garden</p>
        </div>
      </div>

      <button class="profile-button" type="button" onclick="openProfile()" aria-label="Open profile">◌</button>
    </header>

    <section class="greeting">
      <p class="greeting-small">WELCOME BACK, READER</p>
      <h2>ဒီနေ့ ဘယ်ဇာတ်လမ်းကို<br><span>ဖတ်ကြမလဲ?</span></h2>
    </section>

    <section class="search-section">
      <label class="search-box" for="searchInput">
        <span class="search-symbol">⌕</span>
        <input id="searchInput" type="search" placeholder="စာအုပ်ရှာရန်..." autocomplete="off">
        <button id="clearButton" class="clear-button" type="button" onclick="clearSearch()" aria-label="Clear search">×</button>
      </label>
    </section>

    <section class="section">
      <div class="section-title-row">
        <h2>ဆက်ဖတ်ရန်</h2>
        <button class="text-button" type="button" onclick="showMessage('Reading history ကို နောက်ပိုင်းထည့်ပေးပါမယ်')">အားလုံးကြည့်ရန်</button>
      </div>

      <article class="continue-card">
        <div class="continue-cover">
          <div class="cover-orbit"></div>
          <div class="cover-flower float-medium">✿</div>
          <div class="cover-star float-reverse">✦</div>
        </div>

        <div class="continue-info">
          <span class="status-label">BLOOMING · 65%</span>
          <h3>မိုးရာသီရဲ့အိပ်မက်</h3>
          <p class="author">မောင်မောင်</p>

          <div class="progress-row">
            <div class="progress-bar"><span style="width:65%"></span></div>
            <span class="progress-number">65%</span>
          </div>

          <button class="continue-button" type="button" onclick="continueReading()">
            ဆက်ဖတ်ရန် <span>→</span>
          </button>
        </div>
      </article>
    </section>

    <section class="section category-section">
      <div class="section-title-row">
        <h2>အမျိုးအစားများ</h2>
        <button class="text-button" type="button" onclick="showExplore()">ပိုကြည့်ရန်</button>
      </div>

      <div class="category-list">
        <button class="category active" type="button" onclick="selectCategory(this, 'all')">အားလုံး</button>
        <button class="category" type="button" onclick="selectCategory(this, 'ဝတ္ထု')">ဝတ္ထု</button>
        <button class="category" type="button" onclick="selectCategory(this, 'ပညာရေး')">ပညာရေး</button>
        <button class="category" type="button" onclick="selectCategory(this, 'သမိုင်း')">သမိုင်း</button>
        <button class="category" type="button" onclick="selectCategory(this, 'စိတ်ကူးယဉ်')">စိတ်ကူးယဉ်</button>
      </div>
    </section>

    <section class="section">
      <div class="section-title-row">
        <h2>စာအုပ်အသစ်များ</h2>
        <button class="text-button" type="button" onclick="showExplore()">အားလုံးကြည့်ရန်</button>
      </div>

      <div class="book-scroller" id="bookScroller"></div>

      <p class="not-found" id="notFound" hidden>ရှာဖွေထားသော စာအုပ်မတွေ့ပါ။</p>
    </section>

    <section class="profile-panel" id="profilePanel" hidden>
      <div class="profile-panel-head">
        <h2>Profile</h2>
        <button class="close-button" type="button" onclick="closeProfile()">×</button>
      </div>

      <div class="profile-user">
        <div class="profile-avatar">◌</div>
        <div>
          <h3 id="profileName">Reader</h3>
          <p id="profileUsername">@reader</p>
        </div>
      </div>

      <div class="profile-stat-row">
        <div class="profile-stat"><strong>12</strong><span>ဖတ်ပြီး</span></div>
        <div class="profile-stat"><strong id="savedCount">0</strong><span>သိမ်းထား</span></div>
        <div class="profile-stat"><strong>65%</strong><span>ခရီးစဉ်</span></div>
      </div>

      <button class="profile-menu-item" type="button" onclick="showMessage('My Library ကို နောက်ပိုင်းထည့်ပေးပါမယ်')">
        <span>✧</span><span>My Library</span><b>›</b>
      </button>

      <button class="profile-menu-item" type="button" onclick="toggleTheme()">
        <span>☾</span><span>Night Garden</span><b id="themeStatus">ON</b>
      </button>

      <button class="profile-menu-item" type="button" onclick="showMessage('Help & Support ကို နောက်ပိုင်းထည့်ပေးပါမယ်')">
        <span>?</span><span>Help & Support</span><b>›</b>
      </button>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" type="button" onclick="goHome(this)">
      <span>⌂</span><small>ပင်မ</small>
    </button>
    <button class="nav-item" type="button" onclick="showExplore(this)">
      <span>⌕</span><small>ရှာရန်</small>
    </button>
    <button class="nav-item" type="button" onclick="showLibrary(this)">
      <span>✧</span><small>Library</small>
    </button>
    <button class="nav-item" type="button" onclick="goProfile(this)">
      <span>◌</span><small>Profile</small>
    </button>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
    const books = [
      { id: 1, title: "ကြယ်စုများအောက်မှာ", author: "ခင်ခင်", category: "စိတ်ကူးယဉ်", rating: "4.8", state: "SEED" },
      { id: 2, title: "မြန်မာ့သမိုင်းမှတ်တမ်း", author: "သမိုင်းလေ့လာသူ", category: "သမိုင်း", rating: "4.7", state: "SPROUT" },
      { id: 3, title: "စိတ်ကူးပန်းဥယျာဉ်", author: "မေသူ", category: "ပညာရေး", rating: "4.6", state: "BLOOM" },
      { id: 4, title: "တိတ်ဆိတ်သောလမ်း", author: "အောင်အောင်", category: "ဝတ္ထု", rating: "4.5", state: "SEED" }
    ];

    let currentCategory = "all";
    let savedBooks = [];
    const telegramApp = window.Telegram?.WebApp || null;

    function initializeTelegram() {
      if (!telegramApp) return;
      telegramApp.ready();
      telegramApp.expand();
      telegramApp.setHeaderColor?.("#0A0C1F");
      telegramApp.setBackgroundColor?.("#0A0C1F");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function createBookCard(book) {
      const isSaved = savedBooks.includes(book.id);

      return `
        <article class="book-card">
          <div class="book-card-cover">
            <div class="book-cover-glow"></div>
            <div class="book-cover-bloom float-medium">✿</div>
            <div class="book-cover-butterfly float-slow">🦋</div>
          </div>

          <div class="book-card-info">
            <span class="book-state">${escapeHtml(book.state)}</span>
            <h3>${escapeHtml(book.title)}</h3>
            <p class="book-author">${escapeHtml(book.author)}</p>

            <div class="book-meta">
              <span>${escapeHtml(book.category)}</span>
              <span>★ ${escapeHtml(book.rating)}</span>
            </div>

            <div class="book-card-actions">
              <button class="save-book ${isSaved ? "saved" : ""}" type="button" onclick="toggleSave(${book.id})">
                ${isSaved ? "♥" : "♡"}
              </button>
              <button class="read-book" type="button" onclick="readBook(${book.id})">ဖတ်ရန်</button>
            </div>
          </div>
        </article>
      `;
    }

    function renderBooks() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();

      const filteredBooks = books.filter(book => {
        const text = [book.title, book.author, book.category].join(" ").toLowerCase();
        const matchesSearch = !query || text.includes(query);
        const matchesCategory = currentCategory === "all" || book.category === currentCategory;
        return matchesSearch && matchesCategory;
      });

      document.getElementById("bookScroller").innerHTML = filteredBooks.map(createBookCard).join("");
      document.getElementById("notFound").hidden = filteredBooks.length !== 0;
    }

    function selectCategory(button, category) {
      currentCategory = category;
      document.querySelectorAll(".category").forEach(item => item.classList.remove("active"));
      button.classList.add("active");
      renderBooks();
    }

    function toggleSave(bookId) {
      if (savedBooks.includes(bookId)) {
        savedBooks = savedBooks.filter(id => id !== bookId);
        showMessage("Library ထဲမှ ဖယ်ရှားပြီးပါပြီ");
      } else {
        savedBooks.push(bookId);
        showMessage("Library ထဲသိမ်းပြီးပါပြီ");
      }
      document.getElementById("savedCount").textContent = savedBooks.length;
      renderBooks();
    }

    function readBook(bookId) {
      const book = books.find(item => item.id === bookId);
      showMessage(book ? `${book.title}
ဖတ်ရှုရန် feature ကို နောက်ပိုင်းချိတ်ပါမယ်` : "စာအုပ်မတွေ့ပါ");
    }

    function continueReading() {
      showMessage("Reading feature ကို နောက်ပိုင်းချိတ်ပါမယ်");
    }

    function showExplore(button) {
      if (button) setActiveNav(button);
      const input = document.getElementById("searchInput");
      input.focus();
      input.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function showLibrary(button) {
      if (button) setActiveNav(button);
      showMessage("My Library ကို နောက်ပိုင်းပြသပါမယ်");
    }

    function goHome(button) {
      setActiveNav(button);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openProfile() {
      const panel = document.getElementById("profilePanel");
      panel.hidden = false;
      panel.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function goProfile(button) {
      setActiveNav(button);
      openProfile();
    }

    function closeProfile() {
      document.getElementById("profilePanel").hidden = true;
    }

    function setActiveNav(button) {
      document.querySelectorAll(".nav-item").forEach(item => item.classList.remove("active"));
      button.classList.add("active");
    }

    function clearSearch() {
      document.getElementById("searchInput").value = "";
      document.getElementById("clearButton").classList.remove("visible");
      currentCategory = "all";
      document.querySelectorAll(".category").forEach(item => item.classList.remove("active"));
      document.querySelector(".category").classList.add("active");
      renderBooks();
    }

    function toggleTheme() {
      document.body.classList.toggle("light");
      const isLight = document.body.classList.contains("light");
      document.getElementById("themeStatus").textContent = isLight ? "OFF" : "ON";
    }

    function showMessage(message) {
      if (telegramApp?.showAlert) {
        telegramApp.showAlert(message);
        return;
      }
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
    }

    function setupSearch() {
      const input = document.getElementById("searchInput");
      const clearButton = document.getElementById("clearButton");

      input.addEventListener("input", () => {
        clearButton.classList.toggle("visible", input.value.length > 0);
        renderBooks();
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      initializeTelegram();
      setupSearch();
      renderBooks();
    });
  </script>
</body>
</html>
